name: CI - Build & Push Docker Image

# Cuando las pruebas (CI - Tests) pasan en un push a main, construye la imagen para ARM (la EC2 t4g) y la sube a
# Docker Hub con dos etiquetas: el sha del commit (la que despliega el CD) y latest. Si las pruebas fallan, no hay
# imagen y no se despliega: Tests -> Build -> CD.
on:
  workflow_run:
    workflows:
      - CI - Tests
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: empre-backend

jobs:
  dockerhub:
    # Solo pruebas que pasaron, y de un push (no de un PR que apunta a main).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # La etapa final de la imagen corre `apk add` para ARM: necesita emulación en el runner (x86).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
