name: CD - Deploy to EC2

# Cuando el CI sube la imagen, copia los archivos de deploy/ al servidor y corre deploy.sh con el sha.
# Los secretos de la app NO pasan por aquí: viven en /opt/empre/.env del servidor.
on:
  workflow_run:
    workflows:
      - CI - Build & Push Docker Image
    types:
      - completed
  # Para volver a desplegar a mano desde la pestaña Actions (por ejemplo, tras cambiar el .env).
  workflow_dispatch:
    inputs:
      tag:
        description: "Sha completo del commit (40 caracteres). Vacío = el último commit de main."
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Elegir la versión
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "sha=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Revisar la etiqueta
        run: |
          echo "${{ steps.version.outputs.sha }}" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "La etiqueta debe ser un sha de commit." >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.sha }}

      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # La llave pegada desde Windows suele traer CRLF o perder el salto final: OpenSSH la rechaza
          # con "error in libcrypto". Se limpia antes de usarla.
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' | sed '/^$/d' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copiar los archivos de despliegue
        run: |
          scp deploy/docker-compose.prod.yml deploy/Caddyfile deploy/deploy.sh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/empre/"

      - name: Desplegar
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "chmod +x /opt/empre/deploy.sh && /opt/empre/deploy.sh ${{ steps.version.outputs.sha }}"

      - name: Probar el HTTPS público
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://${{ vars.API_DOMAIN }}/health" > /dev/null; then
              echo "https://${{ vars.API_DOMAIN }} responde."
              exit 0
            fi
            sleep 5
          done
          echo "El backend quedó sano en el servidor, pero https://${{ vars.API_DOMAIN }}/health no responde." >&2
          exit 1
