name: CI - Tests

# Corre las pruebas en cada push y pull request. Las de integración usan un PostgreSQL de servicio
# (TEST_DATABASE_URL); sin esa variable se omiten, así que `go test ./...` también corre en local.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: host=localhost port=5432 user=postgres password=postgres dbname=postgres sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  # En los PR también se construye la imagen (sin subirla) para que un Dockerfile roto no llegue a main.
  docker-build:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (sin subir)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
